<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$RSOL Content Generator | LionessOnX</title>
    <style>
        :root {
            --rsol-red: #d32f2f;
            --rsol-dark: #9a0007;
            --text-light: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--rsol-red);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: var(--rsol-dark);
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            margin: 10px 0 0 0;
            font-style: italic;
            color: #ffcccc;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ff6666;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--rsol-red);
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            color: #333;
            box-sizing: border-box;
        }

        button {
            background-color: #ff0000;
            color: white;
            border: 2px solid white;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: white;
            color: var(--rsol-red);
        }

        .output-section {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
        }

        .generated-post {
            background: #fff;
            color: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--rsol-red);
        }

        .generated-post img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #ccc;
        }

        .caption-text {
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>$RSOL Hub</h1>
        <p>Inspired by LionessOnX | The Pride Roars Together 🦁🔴</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Single Post Generator</h2>
            <p>Generate a high-impact image concept and caption to raid the timeline.</p>
            <button onclick="generateSinglePost()">Generate Content & Caption</button>
            <div id="single-output" class="output-section">
                </div>
        </div>

        <div class="card">
            <h2>Auto Content Batcher</h2>
            <p>Need multiple posts for a campaign? Generate up to 10 at once.</p>
            <label for="postCount">Number of contents (Max 10):</label>
            <input type="number" id="postCount" min="1" max="10" value="3">
            <button onclick="generateBatchPosts()">Auto-Generate Batch</button>
            <div id="batch-output" class="output-section">
                </div>
        </div>
    </div>

    <script>
        // Fierce, community-driven captions matching the Lioness vibe
        const captions = [
            "The pride is moving. If you aren't paying attention to $RSOL, you're missing the takeover. 🦁🔴 #Crypto #RSOL",
            "Fierce, relentless, and built for the long haul. $RSOL is not just a token, it's a movement. 🔥💎",
            "They doubted the vision, but the Lioness never sleeps. Watch $RSOL dominate the timeline today! 🚀🐾",
            "Red background, green candles. We are writing history with $RSOL. Who is raiding with us today? 📈🦁",
            "Alpha energy only. $RSOL is leading the pack. Secure your bags before we leave orbit! 🪐🔴",
            "Community is everything, and the $RSOL pride is the strongest in the space. Let's hear that roar! 🗣️🔥",
            "No panic, just patience and power. $RSOL is gearing up for the next leg. Are you ready? 💎🙌",
            "A true Lioness protects her pride and builds her empire. $RSOL is the empire. 👑🔴",
            "Stop fading the obvious. The algorithm loves $RSOL because WE are the algorithm. Raid time! ⚔️🦁",
            "Energy matched. Vision aligned. The $RSOL takeover is inevitable. Let's make some noise! 📢🔴"
        ];

        // Simulated image concepts / placeholders for a content generator
        // In a real production app, you would connect this to an AI image API (like DALL-E or Midjourney)
        const imageConcepts = [
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Majestic+Cyber+Lioness+Roaring",
            "https://via.placeholder.com/400x200/d32f2f/ffffff?text=Glowing+Gold+$RSOL+Coin",
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Red+Chart+Going+Parabolic",
            "https://via.placeholder.com/400x200/d32f2f/ffffff?text=Lion+Pride+Looking+At+The+Moon",
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Fierce+Red+Crypto+Aesthetic"
        ];

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function createPostHTML() {
            const caption = getRandomItem(captions);
            const image = getRandomItem(imageConcepts);
            return `
                <div class="generated-post">
                    <img src="${image}" alt="Generated Content Image">
                    <div class="caption-text">"${caption}"</div>
                </div>
            `;
        }

        function generateSinglePost() {
            const outputDiv = document.getElementById('single-output');
            outputDiv.innerHTML = createPostHTML();
        }

        function generateBatchPosts() {
            const countInput = document.getElementById('postCount');
            const outputDiv = document.getElementById('batch-output');
            
            let count = parseInt(countInput.value);
            
            // Validation: Keep it between 1 and 10
            if (isNaN(count) || count < 1) count = 1;
            if (count > 10) count = 10;
            
            // Ensure the input field reflects the clamped value
            countInput.value = count;

            let postsHTML = '';
            for (let i = 0; i < count; i++) {
                postsHTML += createPostHTML();
            }

            outputDiv.innerHTML = postsHTML;
        }
    </script>
</body>
</html>
