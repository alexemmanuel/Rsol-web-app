<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$RSOL Content Generator | LionessOnX</title>
    <style>
        :root {
            --rsol-red: #d32f2f;
            --rsol-dark: #9a0007;
            --text-light: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--rsol-red);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            background-color: var(--rsol-dark);
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            margin: 10px 0 0 0;
            font-style: italic;
            color: #ffcccc;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            z-index: 10;
            position: relative;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ff6666;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--rsol-red);
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            color: #333;
            box-sizing: border-box;
        }

        button {
            background-color: #ff0000;
            color: white;
            border: 2px solid white;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background-color: white;
            color: var(--rsol-red);
        }
        
        button:disabled {
            background-color: #777;
            border-color: #555;
            cursor: not-allowed;
        }

        .output-section {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
        }

        .generated-post {
            background: #fff;
            color: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--rsol-red);
        }

        .generated-post img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #ccc;
        }

        .caption-text {
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 500;
        }

        /* The FAT RSOL Cat CSS */
        #rsol-cat {
            position: fixed;
            top: 0;
            left: 0;
            font-size: 6rem; /* Increased size for the 'Fat Cat' look */
            z-index: 1; /* Behind the main container portal */
            pointer-events: none; /* So it doesn't interrupt clicks */
            transition: transform 3s linear; /* Smooth, steady walking pace */
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.5)); /* Adds weight visually */
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="rsol-cat">🐈</div>

    <header>
        <h1>$RSOL Hub</h1>
        <p>Inspired by LionessOnX | The Pride Roars Together 🦁🔴</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Single Post Generator</h2>
            <p>Generate a high-impact image concept and caption to raid the timeline.</p>
            <button id="btn-single" onclick="generateSinglePost()">Generate Content & Caption</button>
            <div id="single-output" class="output-section">
                </div>
        </div>

        <div class="card">
            <h2>Auto Content Batcher</h2>
            <p>Need multiple posts for a campaign? Generate up to 10 at once.</p>
            <label for="postCount">Number of contents (Max 10):</label>
            <input type="number" id="postCount" min="1" max="10" value="3">
            <button id="btn-batch" onclick="generateBatchPosts()">Auto-Generate Batch</button>
            <div id="batch-output" class="output-section">
                </div>
        </div>
    </div>

    <script>
        // --- CAT LOGIC ---
        const catElement = document.getElementById('rsol-cat');
        let isGenerating = false;
        let catInterval;

        function moveCat() {
            if (isGenerating) return; // Stop moving if generating
            
            // Calculate safe roaming boundaries for a bigger cat
            const maxX = window.innerWidth - 120;
            const maxY = window.innerHeight - 120;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // Flip the cat depending on which direction it walks (left or right)
            const currentTransform = catElement.style.transform;
            let scaleX = 1;
            if (currentTransform) {
                const currentX = parseInt(currentTransform.split('translate(')[1]);
                if (randomX < currentX) scaleX = -1; // Walk left
            }

            catElement.style.transform = `translate(${randomX}px, ${randomY}px) scaleX(${scaleX})`;
        }

        function sitCatForGeneration() {
            isGenerating = true;
            catElement.innerText = "🐈‍⬛"; // Changes appearance to show it is sitting/waiting
            
            // Send the cat to a far corner away from the generation portal
            const corners = [
                {x: 20, y: 20}, // Top Left
                {x: window.innerWidth - 120, y: 20}, // Top Right
                {x: 20, y: window.innerHeight - 120}, // Bottom Left
                {x: window.innerWidth - 120, y: window.innerHeight - 120} // Bottom Right
            ];
            const randomCorner = corners[Math.floor(Math.random() * corners.length)];
            
            catElement.style.transform = `translate(${randomCorner.x}px, ${randomCorner.y}px)`;
        }

        function resumeCatMovement() {
            isGenerating = false;
            catElement.innerText = "🐈"; // Back to roaming mode
            moveCat(); // Immediate move
        }

        // Start cat walking every 3 seconds for a slower, heavier pace
        catInterval = setInterval(moveCat, 3000);
        moveCat(); // Initial placement


        // --- GENERATOR LOGIC ---
        const captions = [
            "The pride is moving. If you aren't paying attention to $RSOL, you're missing the takeover. 🦁🔴 #Crypto #RSOL",
            "Fierce, relentless, and built for the long haul. $RSOL is not just a token, it's a movement. 🔥💎",
            "They doubted the vision, but the Lioness never sleeps. Watch $RSOL dominate the timeline today! 🚀🐾",
            "Red background, green candles. We are writing history with $RSOL. Who is raiding with us today? 📈🦁",
            "Alpha energy only. $RSOL is leading the pack. Secure your bags before we leave orbit! 🪐🔴",
            "Community is everything, and the $RSOL pride is the strongest in the space. Let's hear that roar! 🗣️🔥",
            "No panic, just patience and power. $RSOL is gearing up for the next leg. Are you ready? 💎🙌",
            "A true Lioness protects her pride and builds her empire. $RSOL is the empire. 👑🔴",
            "Stop fading the obvious. The algorithm loves $RSOL because WE are the algorithm. Raid time! ⚔️🦁",
            "Energy matched. Vision aligned. The $RSOL takeover is inevitable. Let's make some noise! 📢🔴"
        ];

        const imageConcepts = [
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Majestic+Cyber+Lioness+Roaring",
            "https://via.placeholder.com/400x200/d32f2f/ffffff?text=Glowing+Gold+$RSOL+Coin",
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Red+Chart+Going+Parabolic",
            "https://via.placeholder.com/400x200/d32f2f/ffffff?text=Lion+Pride+Looking+At+The+Moon",
            "https://via.placeholder.com/400x200/9a0007/ffffff?text=Fierce+Red+Crypto+Aesthetic"
        ];

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function createPostHTML() {
            const caption = getRandomItem(captions);
            const image = getRandomItem(imageConcepts);
            return `
                <div class="generated-post">
                    <img src="${image}" alt="Generated Content Image">
                    <div class="caption-text">"${caption}"</div>
                </div>
            `;
        }

        function generateSinglePost() {
            const outputDiv = document.getElementById('single-output');
            const btn = document.getElementById('btn-single');
            
            // Trigger Cat Sitting and Button State
            sitCatForGeneration();
            btn.disabled = true;
            btn.innerText = "Generating...";
            
            // Simulate generation delay (1.5 seconds) so you can see the cat wait
            setTimeout(() => {
                outputDiv.innerHTML = createPostHTML();
                btn.disabled = false;
                btn.innerText = "Generate Content & Caption";
                resumeCatMovement();
            }, 1500);
        }

        function generateBatchPosts() {
            const countInput = document.getElementById('postCount');
            const outputDiv = document.getElementById('batch-output');
            const btn = document.getElementById('btn-batch');
            
            let count = parseInt(countInput.value);
            if (isNaN(count) || count < 1) count = 1;
            if (count > 10) count = 10;
            countInput.value = count;

            // Trigger Cat Sitting and Button State
            sitCatForGeneration();
            btn.disabled = true;
            btn.innerText = "Batching...";

            // Simulate generation delay
            setTimeout(() => {
                let postsHTML = '';
                for (let i = 0; i < count; i++) {
                    postsHTML += createPostHTML();
                }
                outputDiv.innerHTML = postsHTML;
                
                btn.disabled = false;
                btn.innerText = "Auto-Generate Batch";
                resumeCatMovement();
            }, 1500);
        }
    </script>
</body>
</html>
